distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# The distribution's SHA-256, from services.gradle.org's own .sha256 file for this exact
# URL and cross-checked against the asset digest GitHub publishes on the release that the
# download redirects to. validateDistributionUrl only checks the host, so without this a
# replaced artifact would be unpacked and executed by every build here.
distributionSha256Sum=ed1a8d686605fd7c23bdf62c7fc7add1c5b23b2bbc3721e661934ef4a4911d7c
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
