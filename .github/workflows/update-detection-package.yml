# Keeps the `bank` pre-release in step with upstream lm-detector.
#
# The app downloads its detection package from that release. An unchanged build is a
# no-op only after both published assets pass readback; incomplete uploads are repaired.
#
# Security shape, deliberately minimal:
#   * only the default branch may publish, through schedule or workflow_dispatch;
#   * contents: write uploads assets; issues: write records real publications. Both use
#     the run's short-lived GITHUB_TOKEN, not a stored PAT;
#   * no third-party actions are used at all — the steps below are plain git and python
#     from the runner image, so there is no action whose moved tag could be hijacked;
#   * the app itself carries no credential: it only GETs public release assets from this
#     repository, so installing the app cannot reach anything here. That also means the
#     repository and its release assets have to stay public for the updater to work.
#
# Operational notes:
#   * GitHub runs scheduled workflows from the default branch only, so this file (and the
#     tools it calls) have to be on `main` — a run on any other branch never fires;
#   * GitHub switches a public repository's schedule off after 60 days without repository
#     activity, and emails the owner when it does. Publishing needs no workaround for
#     that: nothing breaks in the meantime (the published package simply stays as it is),
#     and re-enabling is one click in the Actions tab, after which "Run workflow" retries
#     on demand. A run dropped under load is likewise harmless — the next one sees the
#     same state;
#   * forks: the job would publish into the fork's own release, which no app reads, so it
#     is harmless there. No repository guard is used, because a rename would then stop the
#     schedule silently.
#
# Failing runs, in two layers — a transient hiccup should not need a person:
#   * the steps retry what they can do again cheaply (`git ls-remote`, `git fetch`);
#   * `tools/update_fingerprint_package.py` + `tools/publish_bank.py` retry every call they
#     make to GitHub (5xx, 429, rate-limited 403, DNS/TLS/timeouts/resets) with backoff,
#     and return permanent answers like a 401/404/422 immediately — see `tools/retry.py`;
#   * anything a retry inside a step cannot reach (runner killed the job, step timed out,
#     an unexpected exception) is picked up by `.github/workflows/retry-failed-detection-package.yml`,
#     which re-runs *this* run's failed jobs, bounded by attempt count and a time window.
#     A re-run uses the same repository commit but resolves upstream HEAD again. Unchanged
#     healthy assets are a no-op; changed or incomplete assets are published and verified.
#   * the retry budget is tunable per run without editing code: BANK_RETRY_ATTEMPTS,
#     BANK_RETRY_BASE_DELAY, BANK_RETRY_MAX_DELAY, BANK_RETRY_JITTER.

name: Update detection package

on:
  schedule:
    # Daily. Not on the hour: GitHub delays or drops runs scheduled at peak load.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 与线上逐字节一致也重新上传（用来验证发布通道真的能跑）
        type: boolean
        default: false

permissions:
  # Uploading the release assets needs contents: write; the publish record on the
  # tracking issue ("检测包自动更新记录") is what turns a real publish into an
  # owner notification, and that needs issues: write.
  contents: write
  issues: write

# Two runs replacing the same two assets at once would race.
concurrency:
  group: update-detection-package
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read upstream revision
        id: upstream
        # `git ls-remote` instead of the commits API: no token to spend on a third-party
        # repository, and no anonymous rate limit to hit. It still talks to github.com
        # directly, so a TLS reset or a DNS hiccup here used to fail the run before any
        # real work had started; three tries with a short backoff cover that.
        run: |
          set -euo pipefail
          sha=""
          for attempt in 1 2 3; do
            # stderr is left alone on purpose: when the read fails, git's own message
            # (TLS, DNS, proxy) is the only thing that says which kind of failure it was.
            sha="$(git ls-remote https://github.com/Ikaleio/lm-detector.git HEAD | cut -f1 || true)"
            if [ -n "$sha" ]; then break; fi
            echo "读取上游失败（第 $attempt/3 次），稍后重试" >&2
            sleep $((attempt * 5))
          done
          test -n "$sha"
          echo "upstream HEAD is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out this repository
        run: |
          set -euo pipefail
          git init --quiet work
          git -C work remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          for attempt in 1 2 3; do
            if git -C work fetch --quiet --depth 1 origin "$GITHUB_SHA"; then
              break
            fi
            echo "fetch 失败（第 $attempt/3 次），稍后重试" >&2
            sleep $((attempt * 5))
          done
          git -C work checkout --quiet --detach FETCH_HEAD
          test "$(git -C work rev-parse HEAD)" = "$GITHUB_SHA"
          test -f work/tools/update_fingerprint_package.py

      - name: Publishing tool regression tests
        working-directory: work
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_tests.py python

      - name: Rebuild and publish if upstream moved
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          FORCE: ${{ inputs.force }}
          # Retry budget for the calls this script makes (see tools/retry.py). Four
          # attempts with a 2s→30s backoff and `Retry-After` honoured: long enough to ride
          # out a CDN hiccup or a moment of API rate limiting, short enough that a real
          # failure still fails the job and reaches the job-level retry.
          BANK_RETRY_ATTEMPTS: "4"
          BANK_RETRY_BASE_DELAY: "2"
          BANK_RETRY_MAX_DELAY: "30"
          BANK_RETRY_JITTER: "0.25"
        # The build is deterministic (its builtAt comes from upstream's data, not from the
        # clock), so an unchanged upstream rebuilds to the published digest and the script
        # reports "无需发布". Publishing also reads both assets back and compares them
        # byte for byte, so a truncated upload fails the job instead of going unnoticed.
        run: |
          set -euo pipefail
          args=(
            --revision "$UPSTREAM_SHA"
            --cache-dir "$RUNNER_TEMP/upstream"
            --out "$RUNNER_TEMP/lite-bank.bin"
          )
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          python3 tools/update_fingerprint_package.py "${args[@]}"
